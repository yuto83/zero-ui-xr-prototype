<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zero UI XR v8</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.42),transparent 30%,transparent 65%,rgba(0,0,0,.5))}
#top{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;z-index:10;display:flex;justify-content:space-between;gap:8px}
.badge{padding:9px 12px;border-radius:18px;background:rgba(0,0,0,.52);backdrop-filter:blur(12px);color:#fff;font-size:12px;border:1px solid rgba(255,255,255,.18)}
#status{max-width:82%}
#ai{position:fixed;left:14px;right:14px;top:72px;z-index:10;color:#fff;background:rgba(0,0,0,.48);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:12px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;margin:5px 0}.label{opacity:.65}.value{font-weight:600;text-align:right}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:7px}.bar>div{height:100%;width:0;background:#fff;transition:width .4s}
#intent{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.13)}#reason{font-size:10px;opacity:.62;line-height:1.4;margin-top:4px}
#focus{position:fixed;left:50%;top:50%;width:190px;height:190px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.35);border-radius:22px;pointer-events:none;opacity:.45;transition:.4s}
#focus.active{opacity:.9;box-shadow:0 0 30px rgba(255,255,255,.16)}
#hint{position:fixed;left:50%;bottom:25%;transform:translateX(-50%);z-index:8;color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);padding:9px 14px;border-radius:20px;font-size:11px;white-space:nowrap;transition:.4s}#hint.hide{opacity:0}
#demo{position:fixed;right:14px;top:58px;z-index:12;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;border-radius:16px;padding:8px 11px;font-size:11px}
#results{position:fixed;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:15;background:rgba(0,0,0,.58);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:13px;color:#fff;display:none}
#results h3{margin:0 0 8px;font-size:13px}.r{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
#card{position:fixed;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));z-index:20;color:#fff;background:rgba(12,12,16,.80);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;display:none;animation:appear .45s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.title{font-size:25px;font-weight:700}.sub{font-size:11px;opacity:.55;margin:3px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.cell{background:rgba(255,255,255,.1);border-radius:13px;padding:9px;text-align:center}.cell b{display:block;font-size:17px}.cell span{font-size:10px;opacity:.7}.row{font-size:13px;margin-top:8px}.recipes{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.recipe{padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.1);font-size:12px}
#close{margin-top:13px;width:100%;padding:10px;border:0;border-radius:13px;background:rgba(255,255,255,.12);color:#fff;font-size:14px}
#loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(5px)}
#box{max-width:310px;background:rgba(20,20,25,.84);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:22px}.spin{width:30px;height:30px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.small{font-size:11px;opacity:.7;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video><div id="shade"></div>
<div id="top"><div id="status" class="badge">カメラを起動しています…</div><div class="badge">ZERO UI XR</div></div>
<button id="demo">デモ：即時表示</button>
<div id="ai">
  <div class="line"><span class="label">AI認識</span><span id="recognition" class="value">解析準備中…</span></div>
  <div class="bar"><div id="confidence"></div></div>
  <div id="intent">
    <div class="line"><span class="label">意図推定</span><span id="intentText" class="value">判定中…</span></div>
    <div id="reason">視認状態を分析しています</div>
  </div>
</div>
<div id="focus"></div><div id="hint">商品を自然に見てください</div>
<div id="results"><h3>AI画像認識：上位5件</h3><div id="resultList"></div></div>
<div id="card">
  <div class="title">🥚 卵</div><div class="sub">興味を検知したため、自動で情報を提示しています</div>
  <div class="row">栄養情報</div>
  <div class="grid"><div class="cell"><b>76</b><span>kcal</span></div><div class="cell"><b>6.2g</b><span>たんぱく質</span></div><div class="cell"><b>5.2g</b><span>脂質</span></div></div>
  <div class="row">鮮度：<b>良好</b></div><div class="row">おすすめレシピ</div>
  <div class="recipes"><div class="recipe">ゆで卵</div><div class="recipe">卵焼き</div><div class="recipe">親子丼</div><div class="recipe">オムライス</div></div>
  <button id="close">閉じる</button>
</div>
<div id="loading"><div id="box"><div class="spin"></div><div id="loadingText">AIモデルを読み込んでいます…</div><div class="small">ユーザー操作なしで自動認識します。初回のみ時間がかかる場合があります。</div></div></div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';

const video=document.getElementById('video'),statusEl=document.getElementById('status');
const recognition=document.getElementById('recognition'),confidence=document.getElementById('confidence');
const intent=document.getElementById('intent'),intentText=document.getElementById('intentText'),reason=document.getElementById('reason');
const focus=document.getElementById('focus'),hint=document.getElementById('hint'),loading=document.getElementById('loading'),loadingText=document.getElementById('loadingText');
const card=document.getElementById('card'),results=document.getElementById('results'),resultList=document.getElementById('resultList');
let stream=null,classifier=null,busy=false,stopped=false,timer=null,positiveStreak=0;
const INTERVAL=7000,THRESHOLD=.12;
const EGG=['egg','omelet','omelette','hard-boiled egg','soft-boiled egg','fried egg','scrambled egg','poached egg'];
const setStatus=t=>statusEl.textContent=t;

async function camera(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();setStatus('AIが商品を自動認識しています…')}
 catch(e){setStatus('カメラを起動できませんでした');console.error(e)}
}
async function model(){
 try{
  loadingText.textContent='AIモデルを読み込んでいます…';
  classifier=await pipeline('image-classification','Xenova/mobilenet_v2_1.0_224',{device:'webgpu'}).catch(async()=>await pipeline('image-classification','Xenova/mobilenet_v2_1.0_224'));
  loadingText.textContent='AIモデル準備完了';setTimeout(()=>loading.style.display='none',500);next(1200);
 }catch(e){console.error(e);loadingText.textContent='AIモデルの読み込みに失敗（デモは利用できます）';setTimeout(()=>loading.style.display='none',1200);setStatus('AI認識を準備できませんでした（デモは利用できます）');recognition.textContent='準備失敗'}
}
function next(delay=INTERVAL){clearTimeout(timer);if(!stopped&&card.style.display!=='block')timer=setTimeout(infer,delay)}
async function infer(){
 if(stopped||busy||document.visibilityState!=='visible'||!classifier){next(INTERVAL);return}
 await classify();next(INTERVAL)
}
async function classify(){
 if(busy||!classifier||video.readyState<2)return;busy=true;
 try{
  setStatus('AIが商品を認識しています…');recognition.textContent='解析中…';
  const w=video.videoWidth,h=video.videoHeight,s=Math.min(w,h),sx=(w-s)/2,sy=(h-s)/2;
  const c=document.createElement('canvas');c.width=320;c.height=320;c.getContext('2d').drawImage(video,sx,sy,s,s,0,0,320,320);
  const out=await classifier(c,{top_k:5});showResults(out);
  let eggScore=0,eggLabel='';
  for(const r of out){const l=String(r.label||'').toLowerCase();if(EGG.some(k=>l.includes(k))&&(r.score||0)>eggScore){eggScore=r.score||0;eggLabel=r.label}}
  const top=out[0];recognition.textContent=eggScore?eggLabel+' '+(eggScore*100).toFixed(0)+'%':(top?top.label+' '+(top.score*100).toFixed(0)+'%':'対象不明');
  confidence.style.width=Math.min(100,(eggScore||top?.score||0)*100)+'%';
  if(eggScore>=THRESHOLD){
   positiveStreak++;focus.classList.add('active');intent.style.display='block';intentText.textContent='卵に興味がある可能性';reason.textContent='同一対象を継続して認識 → 視認・滞留を意図の代理指標として推定';hint.classList.add('hide');setStatus('商品認識 → 意図を推定しています…');
  }else{
   positiveStreak=0;focus.classList.remove('active');intent.style.display='none';hint.classList.remove('hide');setStatus('商品を自動認識しています…');
  }
  if(positiveStreak>=2)showUI();
 }catch(e){console.error(e);setStatus('AI認識中にエラーが発生しました');recognition.textContent='一時的に認識できません'}
 finally{busy=false}
}
function showResults(out){
 resultList.innerHTML='';out.slice(0,5).forEach(r=>{const d=document.createElement('div');d.className='r';d.innerHTML='<span></span><span></span>';d.children[0].textContent=r.label||'unknown';d.children[1].textContent=(Number(r.score||0)*100).toFixed(1)+'%';resultList.appendChild(d)});
 results.style.display='block';clearTimeout(window.rh);window.rh=setTimeout(()=>results.style.display='none',4500)
}
function showUI(){positiveStreak=0;card.style.display='block';results.style.display='none';intent.style.display='block';intentText.textContent='興味ありと推定';reason.textContent='商品認識が継続したため、自動で情報を提示';setStatus('意図推定 → 情報を自動提示');clearTimeout(timer)}
function hideUI(){card.style.display='none';setStatus('AIが商品を自動認識しています…');positiveStreak=0;next(1500)}
document.getElementById('demo').onclick=showUI;document.getElementById('close').onclick=hideUI;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')clearTimeout(timer);else if(!stopped&&card.style.display!=='block')next(1000)});
window.addEventListener('pagehide',()=>{stopped=true;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop())});
await camera();await model();
</script>
</body></html>
