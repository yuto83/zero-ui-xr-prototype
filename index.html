<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Zero UI XR Prototype - AI Egg Recognition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.wrap{max-width:600px;margin:auto;padding:20px}
h1{font-size:20px}
.camera{width:100%;aspect-ratio:1;overflow:hidden;border-radius:16px;background:#222}
video{width:100%;height:100%;object-fit:cover}
#status{margin:14px 0;font-weight:700}
button{width:100%;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:700}
button:disabled{opacity:.4}
#result{margin-top:15px;padding:15px;border-radius:12px;background:#222;line-height:1.8;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <h1>Zero UI XR — AI認識テスト v11</h1>
  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <div id="status">準備中…</div>
  <button id="btn">AI認識</button>
  <div id="result">AIモデルを読み込んでいます…</div>
  <canvas id="canvas" style="display:none"></canvas>
</div>
</body>
</html>
