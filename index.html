<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zero UI XR — AI診断 v12</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.wrap{max-width:650px;margin:auto;padding:18px}.camera{width:100%;aspect-ratio:1;background:#222;border-radius:16px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}h1{font-size:20px;margin:0 0 14px}
#status{margin:14px 0;font-weight:700}button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;margin:6px 0}
#log{background:#1d1d1d;border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55;max-height:45vh;overflow:auto}
.ok{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>Zero UI XR — AIモデル診断 v12</h1>
<div class="camera"><video id="video" autoplay playsinline muted></video></div>
<div id="status">準備中…</div>
<button id="load">AIモデルを読み込む</button>
<button id="recognize" disabled>AI認識を実行</button>
<div id="log">ログを表示します。</div>
<canvas id="canvas" width="320" height="320" style="display:none"></canvas>
</div>

<script type="module">
const logEl=document.getElementById('log');
const statusEl=document.getElementById('status');
const loadBtn=document.getElementById('load');
const recBtn=document.getElementById('recognize');
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');

function log(x){
  const s = x instanceof Error ? (x.stack || x.message) : String(x);
  logEl.textContent += "\n\n" + s;
  logEl.scrollTop=logEl.scrollHeight;
}
window.addEventListener('error',e=>log("GLOBAL ERROR\n"+e.message+"\n"+e.filename+":"+e.lineno));
window.addEventListener('unhandledrejection',e=>log("UNHANDLED PROMISE\n"+(e.reason?.stack||e.reason)));

let classifier=null;

async function camera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("getUserMedia が利用できません。HTTPSで開いているか確認してください。");
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    video.srcObject=stream;
    await video.play();
    statusEl.textContent="カメラ起動済み";
    log("✓ カメラ: OK");
  }catch(e){
    statusEl.textContent="カメラ起動失敗";
    log("CAMERA ERROR\n"+(e.stack||e));
  }
}

async function loadAI(){
  loadBtn.disabled=true;
  statusEl.textContent="Transformers.jsを読み込んでいます…";
  log("\n=== AI LOAD START ===");
  try{
    log("1. CDN import開始");
    const mod=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2");
    log("✓ Transformers.js import: OK");

    const pipeline=mod.pipeline;
    if(!pipeline) throw new Error("pipeline が取得できませんでした。");

    statusEl.textContent="AIモデルを読み込んでいます…";
    log("2. pipeline開始");
    log("model = onnx-community/mobilenet_v2_1.0_224");
    log("device = wasm/CPU（WebGPUを使用しません）");

    classifier=await pipeline("image-classification","onnx-community/mobilenet_v2_1.0_224");
    log("✓ AI MODEL LOAD: OK");
    statusEl.textContent="AI準備完了";
    recBtn.disabled=false;
  }catch(e){
    statusEl.textContent="AIモデル読み込み失敗";
    log("❌ AI LOAD ERROR\n"+(e?.stack||e));
    loadBtn.disabled=false;
  }
}

async function recognize(){
  if(!classifier)return;
  try{
    statusEl.textContent="AI認識中…";
    const ctx=canvas.getContext("2d");
    const size=Math.min(video.videoWidth,video.videoHeight);
    if(!size) throw new Error("カメラ映像のサイズを取得できません。");
    const sx=(video.videoWidth-size)/2, sy=(video.videoHeight-size)/2;
    ctx.drawImage(video,sx,sy,size,size,0,0,320,320);
    const results=await classifier(canvas,{top_k:5});
    log("\n=== AI RESULT ===\n"+results.map((r,i)=>(i+1)+". "+r.label+" — "+(r.score*100).toFixed(1)+"%").join("\n"));
    statusEl.textContent="AI認識完了";
  }catch(e){
    statusEl.textContent="AI認識失敗";
    log("❌ INFERENCE ERROR\n"+(e?.stack||e));
  }
}

loadBtn.addEventListener("click",loadAI);
recBtn.addEventListener("click",recognize);
camera();
</script>
</body>
</html>
