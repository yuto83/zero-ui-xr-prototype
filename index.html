<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zero UI XR Prototype - Egg</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 25%,transparent 65%,rgba(0,0,0,.4))}
#top{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;z-index:10;display:flex;justify-content:space-between;align-items:flex-start}
.badge{padding:9px 12px;border-radius:18px;background:rgba(0,0,0,.48);backdrop-filter:blur(10px);color:#fff;font-size:12px;border:1px solid rgba(255,255,255,.18)}
#status{max-width:78%;line-height:1.35}
#aiStatus{font-size:12px;opacity:.9}
#resultPanel{position:fixed;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:11;background:rgba(0,0,0,.58);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:13px;color:#fff;display:none}
#resultPanel h3{margin:0 0 8px;font-size:13px}
.result{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.result:last-child{border-bottom:0}
.result .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .score{flex:none;opacity:.8}
#card{position:fixed;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:20;color:#fff;background:rgba(12,12,16,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#card .title{font-size:24px;font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cell{background:rgba(255,255,255,.1);border-radius:13px;padding:10px;text-align:center}
.cell b{display:block;font-size:17px}
.cell span{font-size:10px;opacity:.7}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.recipes{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.recipe{padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.1);font-size:12px}
#close{margin-top:14px;width:100%;padding:11px;border:0;border-radius:13px;background:rgba(255,255,255,.12);color:#fff;font-size:14px}
#demo{position:fixed;right:14px;top:58px;z-index:12;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;border-radius:16px;padding:8px 11px;font-size:11px}
#loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(5px)}
#loadingBox{max-width:310px;background:rgba(20,20,25,.82);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:22px}
.spinner{width:30px;height:30px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.small{font-size:11px;opacity:.7;line-height:1.5;margin-top:8px}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<div id="shade"></div>

<div id="top">
  <div id="status" class="badge">カメラを起動しています…</div>
  <div class="badge">ZERO UI XR</div>
</div>

<button id="demo">デモ：即時表示</button>

<div id="resultPanel">
  <h3>AI認識結果（上位5件）</h3>
  <div id="results"></div>
</div>

<div id="card">
  <div class="title">🥚 卵</div>
  <div class="row">栄養情報</div>
  <div class="grid">
    <div class="cell"><b>76</b><span>kcal</span></div>
    <div class="cell"><b>6.2g</b><span>たんぱく質</span></div>
    <div class="cell"><b>5.2g</b><span>脂質</span></div>
  </div>
  <div class="row">鮮度：<b>良好</b></div>
  <div class="row">おすすめレシピ</div>
  <div class="recipes">
    <div class="recipe">ゆで卵</div><div class="recipe">卵焼き</div>
    <div class="recipe">親子丼</div><div class="recipe">オムライス</div>
  </div>
  <button id="close">閉じる</button>
</div>

<div id="loading">
  <div id="loadingBox">
    <div class="spinner"></div>
    <div id="loadingText">AIモデルを読み込んでいます…</div>
    <div class="small">初回のみ時間がかかる場合があります。ユーザー操作なしで自動認識します。</div>
  </div>
</div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';

const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const card = document.getElementById('card');
const closeBtn = document.getElementById('close');
const demoBtn = document.getElementById('demo');
const resultPanel = document.getElementById('resultPanel');
const resultsEl = document.getElementById('results');

let stream = null;
let classifier = null;
let busy = false;
let stopped = false;
let positiveStreak = 0;
let lastInference = 0;
let timer = null;

const INTERVAL = 7000; // 7秒に1回。連続推論による負荷を抑える。
const EGG_THRESHOLD = 0.12;
const EGG_WORDS = [
  'egg','omelet','omelette','hard-boiled egg','soft-boiled egg',
  'fried egg','scrambled egg','poached egg'
];

function setStatus(text){
  statusEl.textContent = text;
}

async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('商品を認識しています…');
  }catch(e){
    setStatus('カメラを起動できませんでした');
    console.error(e);
  }
}

async function loadModel(){
  try{
    loadingText.textContent = 'AIモデルを読み込んでいます…';
    classifier = await pipeline('image-classification', 'Xenova/mobilenet_v2_1.0_224', {
      device:'webgpu'
    }).catch(async () => {
      return await pipeline('image-classification', 'Xenova/mobilenet_v2_1.0_224');
    });
    loadingText.textContent = 'AIモデル準備完了';
    setTimeout(()=>loading.style.display='none',500);
    scheduleNextInference(1200);
  }catch(e){
    console.error(e);
    loadingText.textContent = 'AIモデルの読み込みに失敗（デモは利用できます）';
    setTimeout(()=>loading.style.display='none',1200);
    setStatus('AI認識を準備できませんでした（デモは利用できます）');
  }
}

function scheduleNextInference(delay=INTERVAL){
  clearTimeout(timer);
  if(stopped || card.style.display==='block') return;
  timer = setTimeout(runAutomaticInference, delay);
}

async function runAutomaticInference(){
  if(stopped || busy || document.visibilityState !== 'visible' || !classifier){
    scheduleNextInference(INTERVAL);
    return;
  }
  await classifyCenter();
  scheduleNextInference(INTERVAL);
}

async function classifyCenter(){
  if(busy || !classifier || video.readyState < 2) return;
  busy = true;
  lastInference = Date.now();

  try{
    setStatus('商品をAIで確認しています…');

    const w = video.videoWidth;
    const h = video.videoHeight;
    const size = Math.min(w,h);
    const sx = (w-size)/2;
    const sy = (h-size)/2;

    const canvas = document.createElement('canvas');
    canvas.width = 320;
    canvas.height = 320;
    const ctx = canvas.getContext('2d',{willReadFrequently:false});
    ctx.drawImage(video,sx,sy,size,size,0,0,320,320);

    const output = await classifier(canvas,{top_k:5});
    showResults(output);

    let eggScore = 0;
    for(const r of output){
      const label = String(r.label || '').toLowerCase();
      if(EGG_WORDS.some(k=>label.includes(k))) eggScore = Math.max(eggScore, r.score || 0);
    }

    if(eggScore >= EGG_THRESHOLD){
      positiveStreak++;
      setStatus('卵への興味を検知しました');
    }else{
      positiveStreak = 0;
      setStatus('商品を認識しています…');
    }

    // 連続して卵判定された場合のみ自動表示。
    if(positiveStreak >= 2){
      showUI();
    }
  }catch(e){
    console.error(e);
    setStatus('AI認識中にエラーが発生しました');
  }finally{
    busy = false;
  }
}

function showResults(output){
  resultsEl.innerHTML='';
  output.slice(0,5).forEach(r=>{
    const row=document.createElement('div');
    row.className='result';
    row.innerHTML='<span class="label"></span><span class="score"></span>';
    row.querySelector('.label').textContent=r.label || 'unknown';
    row.querySelector('.score').textContent=(Number(r.score||0)*100).toFixed(1)+'%';
    resultsEl.appendChild(row);
  });
  resultPanel.style.display='block';
  clearTimeout(window.resultHideTimer);
  window.resultHideTimer=setTimeout(()=>resultPanel.style.display='none',4500);
}

function showUI(){
  positiveStreak=0;
  card.style.display='block';
  resultPanel.style.display='none';
  setStatus('興味を推定 → 情報を自動表示');
  clearTimeout(timer);
}

function hideUI(){
  card.style.display='none';
  setStatus('商品を認識しています…');
  positiveStreak=0;
  scheduleNextInference(1500);
}

demoBtn.addEventListener('click',()=>{
  showUI();
});

closeBtn.addEventListener('click',hideUI);

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    clearTimeout(timer);
  }else if(!stopped && card.style.display!=='block'){
    scheduleNextInference(1000);
  }
});

window.addEventListener('pagehide',()=>{
  stopped=true;
  clearTimeout(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
});

await startCamera();
await loadModel();
</script>
</body>
</html>
